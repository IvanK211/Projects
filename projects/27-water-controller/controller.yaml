# BENCH REFERENCE ONLY. Pin choices are arbitrary, not a recovered wiring diagram.
# Connect only an isolated low-voltage indicator or suitably protected low-voltage load.
esphome:
  name: reference-water-controller
  on_boot:
    priority: -100
    then:
      - switch.turn_off: pump_output
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

binary_sensor:
  - platform: gpio
    id: water_ok
    name: Reference water-level input
    pin:
      number: GPIO25
      mode:
        input: true
        pullup: true
      inverted: true
    # Healthy is a closed circuit to ground. An open wire is interpreted as unsafe.
    filters:
      - delayed_on: 2s
      - delayed_off: 20ms
    on_release:
      then:
        - script.stop: bench_pulse
        - switch.turn_off: pump_output

switch:
  - platform: gpio
    id: pump_output
    internal: true
    pin: GPIO26
    restore_mode: ALWAYS_OFF

script:
  - id: bench_pulse
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(water_ok).has_state() && id(water_ok).state;'
          then:
            - switch.turn_on: pump_output
            - delay: 2s
            - switch.turn_off: pump_output

button:
  - platform: template
    name: Reference bench pulse
    on_press:
      - script.execute: bench_pulse

interval:
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: 'return !id(water_ok).has_state() || !id(water_ok).state;'
          then:
            - switch.turn_off: pump_output
